services:
  rag-app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Без LLM_API_KEY приложение работает в режиме retrieval-only
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
    volumes:
      - ./data:/app/data
